<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="wandWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c4e25"/>
      <stop offset="50%" stop-color="#5a2f14"/>
      <stop offset="100%" stop-color="#361a0a"/>
    </linearGradient>
    <linearGradient id="wandGrip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#361a0a"/>
      <stop offset="50%" stop-color="#1f0e05"/>
      <stop offset="100%" stop-color="#0f0602"/>
    </linearGradient>
  </defs>

  <!-- Dark silhouette outline for 100% contrast on white and black backgrounds -->
  <line x1="5.5" y1="5.5" x2="20.5" y2="20.5" stroke="#000000" stroke-width="4.2" stroke-linecap="round"/>
  <line x1="19" y1="19" x2="27.5" y2="27.5" stroke="#000000" stroke-width="5.8" stroke-linecap="round"/>
  <circle cx="27.5" cy="27.5" r="3.2" fill="#000000"/>

  <!-- Wand Shaft -->
  <line x1="5.5" y1="5.5" x2="20.5" y2="20.5" stroke="url(#wandWood)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="5.2" y1="5.2" x2="19.5" y2="19.5" stroke="#ba7542" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Wand Handle -->
  <line x1="19" y1="19" x2="27.5" y2="27.5" stroke="url(#wandGrip)" stroke-width="3.8" stroke-linecap="round"/>

  <!-- Gold bands and pommel -->
  <circle cx="19" cy="19" r="2.0" fill="#ffd700" stroke="#8a6d1c" stroke-width="0.5"/>
  <circle cx="23" cy="23" r="2.1" fill="#ffd700" stroke="#8a6d1c" stroke-width="0.5"/>
  <circle cx="27.5" cy="27.5" r="2.4" fill="#ffd700" stroke="#8a6d1c" stroke-width="0.6"/>
  <circle cx="27.0" cy="27.0" r="0.8" fill="#fff5b8"/>

  <!-- Gold Tip Ferrule -->
  <circle cx="5.5" cy="5.5" r="1.6" fill="#ffd700" stroke="#8a6d1c" stroke-width="0.5"/>

  <!-- Active Glowing Pointer Aura & Star at Tip (3, 3) -->
  <!-- Dark glow outline -->
  <circle cx="3" cy="3" r="4.5" fill="#ffd700" fill-opacity="0.35"/>
  <circle cx="3" cy="3" r="3.0" fill="#ffe57f" fill-opacity="0.55"/>

  <!-- Radiant 8-Point Starburst -->
  <!-- Horizontal & Vertical -->
  <line x1="0" y1="3" x2="6" y2="3" stroke="#000000" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="3" y1="0" x2="3" y2="6" stroke="#000000" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="0" y1="3" x2="6" y2="3" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="3" y1="0" x2="3" y2="6" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Diagonal Rays -->
  <line x1="1" y1="1" x2="5" y2="5" stroke="#ffd700" stroke-width="1.0" stroke-linecap="round"/>
  <line x1="1" y1="5" x2="5" y2="1" stroke="#ffd700" stroke-width="1.0" stroke-linecap="round"/>

  <!-- Center Core -->
  <circle cx="3" cy="3" r="1.5" fill="#ffffff"/>

  <!-- Magic Sparkles -->
  <circle cx="7.5" cy="1.5" r="0.9" fill="#ffeaa7" stroke="#000000" stroke-width="0.3"/>
  <circle cx="1.5" cy="7.5" r="0.9" fill="#ffeaa7" stroke="#000000" stroke-width="0.3"/>
  <circle cx="8" cy="5.5" r="0.7" fill="#ffd700"/>
  <circle cx="5.5" cy="8" r="0.7" fill="#ffd700"/>
</svg>
